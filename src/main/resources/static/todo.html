<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RE:PLAN - Todo 등록</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="todo-page">

    <header class="page-header">
        <button
                class="back-button"
                onclick="location.href='/home.html'">
            ←
        </button>

        <h1>Todo 등록</h1>
    </header>

    <main class="todo-content">

        <section class="todo-write">

            <label for="todoTitle">
                할 일
            </label>

            <input
                    id="todoTitle"
                    type="text"
                    placeholder="할 일을 입력하세요">

            <label for="todoAdditionalInfo">
                추가 정보
            </label>

            <textarea
                    id="todoAdditionalInfo"
                    placeholder="범위, 현재 진행 상황 등 계획에 참고할 정보를 입력하세요. (선택)"></textarea>

            <label for="todoDeadline">
                마감일
            </label>

            <input
                    id="todoDeadline"
                    type="datetime-local">

            <button id="todoButton">
                등록 및 AI 계획 생성
            </button>

        </section>


        <section class="plan-section">

            <h2>AI 계획</h2>

            <div id="planResult"></div>

        </section>

    </main>

</div>

<script src="/js/todo.js"></script>

</body>
</html>
