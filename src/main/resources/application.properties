spring.application.name=replan
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/replan_db
spring.datasource.username=${REPLAN_DB_USERNAME}
spring.datasource.password=${REPLAN_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
gemini.api.key=${REPLAN_GEMINI_API_KEY}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
